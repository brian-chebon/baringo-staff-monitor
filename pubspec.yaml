name: staff_performance_mapping
description: Baringo County Government staff performance and field-activity tracking app.

publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.0.0

  # State management
  provider: ^6.1.5

  # Location & maps
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0

  # Network
  http: ^1.6.0

  # Formatting / export
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  csv: ^8.0.0
  path_provider: ^2.1.5
  open_file: ^3.5.11
  universal_html: ^2.3.0

  # Image capture & rendering
  image_picker: ^1.2.2
  flutter_svg: ^2.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/bcg_logo.png
    - assets/images/baringo_flag.svg
