<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Baringo County Government Staff Performance Monitoring System">
  <meta name="theme-color" content="#1B5E20">

  <!-- iOS / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BCG Staff Monitor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BCG Staff Monitor</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API.
    REQUIRED for `google_maps_flutter` on web.
    Replace YOUR_GOOGLE_MAPS_API_KEY with a key from the Google Cloud Console
    that has the "Maps JavaScript API" enabled and is restricted to your
    Firebase Hosting domain (e.g. bcg-staff-app.web.app).
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
